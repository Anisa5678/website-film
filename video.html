<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MovieSpace - Tonton Film</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #080b14;
            color: white;
            min-height: 100vh;
        }

        /* NAVBAR */
        nav {
            width: 100%;
            background: #101522;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 3px 15px rgba(0,0,0,0.4);
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            color: #ffca28;
        }

        .logo span {
            color: white;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 25px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-size: 15px;
            transition: 0.3s;
        }

        nav ul li a:hover {
            color: #ffca28;
        }

        /* CONTENT */
        .container {
            width: 90%;
            max-width: 1100px;
            margin: 50px auto;
        }

        .title {
            text-align: center;
            margin-bottom: 35px;
        }

        .title h1 {
            font-size: 35px;
            margin-bottom: 10px;
        }

        .title h1 span {
            color: #ffca28;
        }

        .title p {
            color: #aaa;
            font-size: 15px;
        }

        /* VIDEO BOX */
        .video-box {
            background: #101522;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        video {
            width: 100%;
            max-height: 600px;
            display: block;
            border-radius: 10px;
            background: black;
        }

        .info {
            padding: 25px 5px 5px;
        }

        .info h2 {
            color: #ffca28;
            margin-bottom: 12px;
            font-size: 28px;
        }

        .info p {
            color: #ccc;
            line-height: 1.7;
            font-size: 16px;
        }

        /* BUTTON */
        .back-btn {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 22px;
            background: #ffca28;
            color: #111;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: #ffd95a;
            transform: translateY(-2px);
        }

        /* ERROR */
        .error {
            text-align: center;
            padding: 70px 20px;
            background: #101522;
            border-radius: 15px;
        }

        .error h2 {
            color: #ff5252;
            margin-bottom: 15px;
        }

        .error p {
            color: #aaa;
        }

        /* FOOTER */
        footer {
            background: #101522;
            text-align: center;
            padding: 25px;
            margin-top: 60px;
            color: #aaa;
        }

        footer span {
            color: #ffca28;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {

            nav {
                flex-direction: column;
                gap: 15px;
            }

            nav ul {
                gap: 15px;
                flex-wrap: wrap;
                justify-content: center;
            }

            .title h1 {
                font-size: 28px;
            }

            .info h2 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <nav>
        <div class="logo">
            Movie<span>Space</span>
        </div>

        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="film.html">Film</a></li>
            <li><a href="index.html#about">About</a></li>
            <li><a href="index.html#galeri">Galeri</a></li>
            <li><a href="index.html#kontak">Kontak</a></li>
        </ul>
    </nav>


    <!-- CONTENT -->
    <div class="container">

        <div class="title">
            <h1>🎬 <span>MovieSpace</span> Cinema</h1>
            <p>Selamat menonton film pilihan kamu</p>
        </div>


        <div id="content">

            <div class="video-box">

                <video id="videoPlayer" controls>
                    <source id="videoSource" src="" type="video/mp4">
                    Browser kamu tidak mendukung video HTML5.
                </video>

                <div class="info">

                    <h2 id="filmTitle">
                        Memuat film...
                    </h2>

                    <p id="filmDescription">
                        Memuat informasi film...
                    </p>

                    <a href="film.html" class="back-btn">
                        ← Kembali ke Daftar Film
                    </a>

                </div>

            </div>

        </div>

    </div>


    <!-- FOOTER -->
    <footer>
        <p>
            © 2026 <span>MovieSpace</span> |
            Website Film Anisa Fitriani
        </p>
    </footer>


    <script>

        // Mengambil parameter film dari URL
        const params = new URLSearchParams(window.location.search);

        const film = params.get("film");


        // Data film
        const dataFilm = {

            avengers: {
                nama: "Avengers: Endgame",
                video: "video/avengers.mp4",
                deskripsi:
                    "Film superhero yang menceritakan perjuangan para Avengers dalam menghadapi ancaman besar."
            },

            titanic: {
                nama: "Titanic",
                video: "video/titanic.mp4",
                deskripsi:
                    "Film drama romantis yang menceritakan kisah cinta dua orang dari latar belakang berbeda dalam perjalanan kapal Titanic."
            },

            "harry-potter": {
                nama: "Harry Potter",
                video: "video/harry-potter.mp4",
                deskripsi:
                    "Kisah seorang penyihir muda yang belajar di sekolah sihir dan mengalami berbagai petualangan."
            },

            "lion-king": {
                nama: "The Lion King",
                video: "video/lion-king.mp4",
                deskripsi:
                    "Perjalanan Simba menghadapi berbagai tantangan hingga menjadi seorang pemimpin."
            },

            spiderman: {
                nama: "Spider-Man",
                video: "video/spiderman.mp4",
                deskripsi:
                    "Seorang pemuda mendapatkan kekuatan khusus dan menggunakannya untuk membantu orang lain."
            }

        };


        // Ambil elemen HTML
        const videoPlayer = document.getElementById("videoPlayer");
        const videoSource = document.getElementById("videoSource");
        const filmTitle = document.getElementById("filmTitle");
        const filmDescription = document.getElementById("filmDescription");
        const content = document.getElementById("content");


        // Cek film
        if (film && dataFilm[film]) {

            const data = dataFilm[film];

            // Tampilkan judul
            filmTitle.textContent = data.nama;

            // Tampilkan deskripsi
            filmDescription.textContent = data.deskripsi;

            // Masukkan video
            videoSource.src = data.video;

            // Reload video
            videoPlayer.load();

        } else {

            content.innerHTML = `
                <div class="error">

                    <h2>❌ Film Tidak Ditemukan</h2>

                    <p>
                        Film yang kamu pilih tidak tersedia.
                    </p>

                    <a href="film.html" class="back-btn">
                        ← Kembali ke Daftar Film
                    </a>

                </div>
            `;

        }

    </script>

</body>
</html>
